name: 定时抓取 Akakçe TP-Link 价格

on:
  schedule:
    # UTC 时间每小时第 5 分钟运行一次(避开整点高峰,减小被限流概率)
    - cron: "5 * * * *"
  workflow_dispatch: {} # 允许在 GitHub 网页上手动点击运行,方便测试

permissions:
  contents: write # 需要写权限,才能把抓取结果提交回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 运行抓取脚本
        run: python scraper.py

      - name: 提交并推送更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "自动更新价格数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
